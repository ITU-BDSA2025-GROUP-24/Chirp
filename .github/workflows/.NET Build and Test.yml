name: .NET Build and Test

on:
  push:
    branches: [ new-main ]
  pull_request:
    branches: [ new-main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore Chirp/Chirp.sln
      
    - name: Build
      run: dotnet build Chirp/Chirp.sln --no-restore
      
    - name: Test
      run: dotnet test Chirp/Chirp.sln --no-build --verbosity normal
