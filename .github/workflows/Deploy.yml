name: Deploy to Azure Web App
on:
  push:
    branches: [ DeployCorrect ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/Chirp.Web/Chirp.Web.csproj

      - name: Publish (framework-dependent)
        run: dotnet publish src/Chirp.Web/Chirp.Web.csproj -c Release -o ${{ github.workspace }}/publish /p:UseAppHost=false

      - name: Create deployment package
        run: |
          cd "${{ github.workspace }}/publish"
          zip -r "${{ github.workspace }}/site.zip" .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: bdsagroup24chirpremotedb
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/site.zip